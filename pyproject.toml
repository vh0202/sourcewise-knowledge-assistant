[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sourcewise.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]  # SIM905: the stop-word list reads better as a block of text

[tool.ruff.lint.per-file-ignores]
# Typed FastAPI dependencies are declared with Annotated(Depends(...)) defaults.
"sourcewise/api/*.py" = ["B008"]
